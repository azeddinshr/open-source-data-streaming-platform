name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q

  dbt:
    name: dbt build on seeded Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: de_user
          POSTGRES_PASSWORD: de_password
          POSTGRES_DB: analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U de_user -d analytics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: de_password
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Create schemas and seed fixtures
        run: |
          for f in infrastructure/sql/*.sql; do
            psql -h localhost -U de_user -d analytics -v ON_ERROR_STOP=1 -f "$f"
          done
          psql -h localhost -U de_user -d analytics -v ON_ERROR_STOP=1 -f tests/fixtures/seed.sql
      - name: dbt build
        run: uv run dbt build --project-dir dbt --profiles-dir dbt