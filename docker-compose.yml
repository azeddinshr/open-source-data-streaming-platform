name: realtime-data-platform

networks:
  data-platform:
    driver: bridge

volumes:
  postgres_data:
  redpanda_data:

services:

  postgres:
    image: postgres:16
    container_name: de-postgres
    environment:
      POSTGRES_USER: de_user
      POSTGRES_PASSWORD: de_password
      POSTGRES_DB: analytics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/sql:/docker-entrypoint-initdb.d:ro
    networks:
      - data-platform

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.4
    container_name: de-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr
      - internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr
      - internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr
      - internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr
      - redpanda:33145
      - --advertise-rpc-addr
      - redpanda:33145
      - --mode
      - dev-container
      - --smp
      - "1"
      - --default-log-level=info
    ports:
      - "19092:19092"
      - "18081:18081"
      - "18082:18082"
      - "19644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - data-platform

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.12.0
    container_name: de-redpanda-console
    depends_on:
      - redpanda
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml
        /app/console
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers:
            - redpanda:9092
        schemaRegistry:
          enabled: true
          urls:
            - http://redpanda:8081
        redpanda:
          adminApi:
            enabled: true
            urls:
              - http://redpanda:9644
    ports:
      - "8080:8080"
    networks:
      - data-platform

  spark:
    image: ${SPARK_IMAGE:-apache/spark:3.5.1-python3}
    container_name: de-spark
    profiles: ["batch"]
    user: root
    working_dir: /app
    environment:
      HOME: /tmp
    volumes:
      - ./batch:/app/batch
      - ./data:/data
    networks:
      - data-platform

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.4
    container_name: de-redpanda-init
    depends_on:
      - redpanda
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until rpk -X brokers=redpanda:9092 cluster info >/dev/null 2>&1; do sleep 2; done
        rpk -X brokers=redpanda:9092 topic create github-events -p 1 -r 1 || true
        rpk -X brokers=redpanda:9092 topic create github-events-dlq -p 1 -r 1 || true
    networks:
      - data-platform

  producer:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    container_name: de-producer
    command: ["python", "ingestion/producer.py"]
    environment:
      KAFKA_BROKER: redpanda:9092
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - data-platform

  consumer:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    container_name: de-consumer
    command: ["python", "ingestion/raw_consumer.py"]
    environment:
      KAFKA_BROKER: redpanda:9092
      POSTGRES_DSN: host=postgres port=5432 dbname=analytics user=de_user password=de_password
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      postgres:
        condition: service_started
    restart: unless-stopped
    networks:
      - data-platform
  
  airflow:
    build:
      context: .
      dockerfile: orchestration/Dockerfile
    container_name: de-airflow
    command: ["bash", "-c", "airflow db migrate && exec airflow standalone"]
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      AIRFLOW__API_AUTH__JWT_SECRET: local-dev-only-secret-change-me-0123456789abcdef
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://de_user:de_password@postgres:5432/airflow
      AIRFLOW_CONN_ANALYTICS_PG: postgresql://de_user:de_password@postgres:5432/analytics
    ports:
      - "8085:8080"
    volumes:
      - ./orchestration/dags:/opt/airflow/dags
      - ./batch:/opt/airflow/batch
      - ./dbt:/opt/airflow/dbt
      - ./data:/data
    depends_on:
      - postgres
    networks:
      - data-platform