version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: github_events
        loaded_at_field: loaded_at
        freshness:
          warn_after: { count: 1, period: hour }
          error_after: { count: 24, period: hour }
        columns:
          - name: event_id
            tests:
              - unique
              - not_null