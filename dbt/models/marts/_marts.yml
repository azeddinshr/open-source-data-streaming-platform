version: 2

models:
  - name: fct_events_hourly
    description: "Event counts per hour, event type and bot flag. Incremental with a 3h lookback."
    columns:
      - name: hour_key
        tests: [unique, not_null]
      - name: event_hour
        tests: [not_null]
      - name: event_count
        tests: [not_null]

  - name: mart_repo_activity
    columns:
      - name: repo_id
        description: "GitHub repository ID (natural key)."
        tests:
          - unique
          - not_null
      - name: repo_name
        description: "Repository name; may repeat across recreated repos."